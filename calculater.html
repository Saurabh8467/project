<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #calculator {
            width: 320px;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
        }

        .display {
            width: 100%;
            height: 65px;
            background: white;
            border: none;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 28px;
            text-align: right;
            padding: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .operator {
            background: #2563eb;
        }

        .clear {
            background: #dc2626;
        }

        .equal {
            background: #16a34a;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div id="calculator">

        <input type="text" class="display" placeholder="0" readonly>

        <div class="buttons">

            <button onclick="GetData('AC')" class="clear">AC</button>
            <button onclick="GetData('DEL')">DEL</button>
            <button onclick="GetData('%')">%</button>
            <button onclick="GetData('÷')" class="operator">÷</button>

            <button onclick="GetData('7')">7</button>
            <button onclick="GetData('8')">8</button>
            <button onclick="GetData('9')">9</button>
            <button onclick="GetData('×')" class="operator">×</button>

            <button onclick="GetData('4')">4</button>
            <button onclick="GetData('5')">5</button>
            <button onclick="GetData('6')">6</button>
            <button onclick="GetData('-')" class="operator">-</button>

            <button onclick="GetData('1')">1</button>
            <button onclick="GetData('2')">2</button>
            <button onclick="GetData('3')">3</button>
            <button onclick="GetData('+')" class="operator">+</button>

            <button onclick="GetData('00')">00</button>
            <button onclick="GetData('0')">0</button>
            <button onclick="GetData('.')">.</button>
            <button onclick="GetData('=')" class="equal">=</button>
        </div>

    </div>

    <script>
      const inputFieldEl = document.querySelector(".display");

function GetData(value) {

    if (inputFieldEl.value === "Error") {
        inputFieldEl.value = "";
    }

    if (value === "AC") {
        inputFieldEl.value = "";
    }

    else if (value === "DEL") {
        inputFieldEl.value = inputFieldEl.value.slice(0,-1);
    }

    else if (value === "=") {
        calculateResult();
    }

    else if (value === "%") {
        inputFieldEl.value += "/100";
    }

    else if (value === "×") {
        inputFieldEl.value += "*";
    }

    else if (value === "÷") {
        inputFieldEl.value += "/";
    }

    else {
        inputFieldEl.value += value;
    }
}


function calculateResult() {

    try {

        const result = Function(
            '"use strict"; return (' + inputFieldEl.value + ')'
        )();

        if (!Number.isFinite(result)) {
            inputFieldEl.value = "Error";
        } else {
            inputFieldEl.value = result;
        }

    } catch (error) {
        inputFieldEl.value = "Error";
    }

}
    </script>

</body>

</html>
